services:
  node:
    build:
      context: .
      dockerfile: services/node/Dockerfile.node
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        NODE_APT_PACKAGES: ${NODE_APT_PACKAGES:-default-mysql-client}
        PG_CLIENT_VERSION: ${PG_CLIENT_VERSION:-17}
        NODE_ENTRYPOINT: ${NODE_ENTRYPOINT:-services/node/entrypoint.node.sh}
    hostname: node${INSTANCE}
    container_name: node${INSTANCE}
    restart: unless-stopped
    init: true
    working_dir: /var/www/html
    volumes:
      - ./data:/var/www/html
    ports:
      - "${MCP_ACCESS:-127.0.0.1:8932:8932}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      - MCP_PORT=${MCP_PORT:-8932}
      - NODE_MODE=${NODE_MODE:-mcp}
    networks:
      - network

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.MCP_PORT||8932)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

networks:
  network:
    external: true
    name: ${NETWORK:-network}
